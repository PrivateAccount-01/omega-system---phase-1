name: Trading Calendar Guard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"
  push:
    paths:
      - "config/trading_holidays_india.json"
      - "scripts/check_trading_calendar_coverage.py"
      - "src/omegadata/track_a/trading_calendar.py"
      - "src/omegadata/config.py"

jobs:
  coverage-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: pip install -e .[dev]
      - name: Check trading-calendar coverage
        run: PYTHONPATH=src python scripts/check_trading_calendar_coverage.py
