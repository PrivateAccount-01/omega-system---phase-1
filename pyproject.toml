[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omegadata"
version = "0.1.0"
description = "OmegaData Bloomberg-grade market data infrastructure for Indian equities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2.9",
  "alembic>=1.13.2",
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
  "pandas>=2.2.2",
  "pyarrow>=17.0.0",
  "numpy>=2.1.0",
  "prometheus-client>=0.20.0",
  "redis>=5.0.8",
  "confluent-kafka>=2.5.3",
  "clickhouse-connect>=0.7.18",
  "python-dateutil>=2.9.0.post0",
  "pendulum>=3.0.0",
  "orjson>=3.10.7",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.4",
  "mypy>=1.11.2",
  "types-python-dateutil>=2.9.0.20240316"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "realdata: tests requiring live external market data APIs"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
plugins = []
